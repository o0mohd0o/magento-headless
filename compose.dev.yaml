services:
  app:
    volumes: &appvolumes
      ## Host mounts with performance penalty, only put what is necessary here
      - ./src/app/code:/var/www/html/app/code:cached
      - ./src/app/design:/var/www/html/app/design:cached
      - ./src/app/etc:/var/www/html/app/etc:cached
      - ./src/composer.json:/var/www/html/composer.json:cached
      - ./src/composer.lock:/var/www/html/composer.lock:cached
      - ./src/grunt-config.json.sample:/var/www/html/grunt-config.json:cached
      - ./src/Gruntfile.js.sample:/var/www/html/Gruntfile.js:cached
      - ./src/dev/tools/grunt/configs:/var/www/html/dev/tools/grunt/configs:cached
      ## HEADLESS: public domain serves the Next.js storefront; Magento
      ## /graphql /rest /soap return 404. Replaces Magento's nginx.conf.sample.
      - ./docker/app/nginx-headless.conf:/var/www/html/nginx.conf:cached
      ## HEADLESS: internal-only :8181 Magento listener the storefront reads from.
      - ./docker/app/conf.d-headless.conf:/etc/nginx/conf.d/zz-headless.conf:cached
      - ./src/package.json.sample:/var/www/html/package.json:cached
      - ./src/generated:/var/www/html/generated:cached
      - ./src/var:/var/www/html/var:cached
      #- ./src/auth.json:/var/www/html/auth.json:cached
      #- ./src/m2-hotfixes:/var/www/html/m2-hotfixes:cached
      #- ./src/patches:/var/www/html/patches:cached

  phpfpm:
    volumes: *appvolumes

  phpfpm-xdebug:
    volumes: *appvolumes

  ## Headless storefront (Next.js 16) — internal-only; reached through the
  ## `app` front-door, never published to the host directly. It fetches Magento
  ## GraphQL privately at http://app:8181 (see env/storefront.env).
  storefront:
    build: ./storefront
    env_file: env/storefront.env
    volumes:
      - ./storefront:/app
      - /app/node_modules
    depends_on:
      - app
    restart: unless-stopped

  phpmyadmin:
    image: linuxserver/phpmyadmin
    env_file: env/db.env
    ports:
      - "8080:80"
    depends_on:
      - db

  ## Selenium support, uncomment to enable
  #selenium:
  #  image: selenium/standalone-chrome-debug:3.8.1
  #  ports:
  #    - "5900:5900"
  #  extra_hosts: *appextrahosts
