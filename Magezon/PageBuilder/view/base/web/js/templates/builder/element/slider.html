<div class="mgz-block">
	<div ng-if="element.title || element.description" class="mgz-block-heading mgz-block-heading-align-{{ element.title_align }} {{ element.show_line ? 'mgz-block-heading-line' : '' }} mgz-block-heading-line-position-{{ element.line_position }}">
		<div ng-bind-html="getTitleHtml()"></div>
		<p class="info" ng-if="element.description" ng-bind-html="element.description"></p>
	</div>
	<div class="mgz-block-content">
		<mgz-owl-carousel additional-class="additionalClass" owl-items="owlItems" owl-properties="owlSettings">
		    <div class="item mgz-carousel-item mgz-slider-item hover-type-{{ element.hover_effect }}" ng-repeat="item in owlItems" ng-init="$last && finished()" ng-style="{'background-image': item.image ? 'url(' + $root.magezonBuilderUrl.getImageUrl(item.image) + ')' : 'none', 'min-height': (element.slider_height || 400) + 'px', 'background-size': 'cover', 'background-position': 'center'}">
		    	<div class="item-inner mgz-flex-position-{{ item.content_position || 'middle-center' }}">
					<div class="item-content" ng-if="item.heading || item.caption1 || item.caption2">
						<div class="slide-heading" ng-if="item.heading" ng-bind-html="getTrustedHtml(item.heading)"></div>
						<div class="slide-caption1" ng-if="item.caption1" ng-bind-html="getTrustedHtml(item.caption1)"></div>
						<div class="slide-caption2" ng-if="item.caption2" ng-bind-html="getTrustedHtml(item.caption2)"></div>
					</div>
					<div class="mgz-overlay" ng-if="element.overlay_color"></div>
				</div>
			</div>
		</mgz-owl-carousel>
	</div>
</div>
