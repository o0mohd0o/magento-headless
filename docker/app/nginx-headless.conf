# =============================================================================
# Headless Magento vhost (server-context fragment).
#
# The markshust/magento-nginx image includes this file into its public
# :8000 / :8443 (TLS) server block, in place of Magento's stock
# nginx.conf.sample (see the mount in compose.dev.yaml).
#
# This is what makes the PUBLIC domain "true headless":
#   /                       -> the Next.js storefront (the only public face)
#   /admin                  -> Magento admin (kept public, login-protected)
#   /media/  /static/       -> Magento (the browser must load product imagery)
#   /graphql /rest /soap    -> 404  (Magento APIs are NOT exposed publicly)
#
# The storefront never reads GraphQL from this public vhost. It talks to
# Magento privately over the Docker network via the internal :8181 listener
# defined in conf.d-headless.conf.
# =============================================================================

set $MAGE_ROOT /var/www/html;

root $MAGE_ROOT/pub;
index index.php;
autoindex off;
charset UTF-8;
client_max_body_size 64M;
error_page 404 403 = /errors/404.php;

# ---- Storefront (Next.js) is the default for everything Magento doesn't own ----
# Variable + Docker DNS resolver so nginx does NOT resolve "storefront" at
# startup (avoids a boot race if the storefront container isn't up yet).
location / {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $sf_upstream storefront:3000;
    proxy_pass http://$sf_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# ---- Admin stays public (login-protected) per the deploy decision ----
location ^~ /admin { try_files $uri $uri/ /index.php$is_args$args; }

# ---- FULL ISOLATION: Magento APIs are not reachable on the public domain ----
location ^~ /graphql { return 404; }
location ^~ /rest    { return 404; }
location ^~ /soap    { return 404; }

# ---- Magento static assets (loaded directly by the browser) ----
location /static/ {
    location ~ ^/static/version\d*/ {
        rewrite ^/static/version\d*/(.*)$ /static/$1 last;
    }
    location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|avifs|js|css|eot|ttf|otf|woff|woff2|html|json|webmanifest)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        if (!-f $request_filename) { rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last; }
    }
    if (!-f $request_filename) { rewrite ^/static/(version\d*/)?(.*)$ /static.php?resource=$2 last; }
    add_header X-Frame-Options "SAMEORIGIN";
}

# ---- Magento media (product images) ----
location = /media/ {
    add_header X-Frame-Options "SAMEORIGIN";
    default_type text/plain;
    return 200 "";
}

location /media/ {
    location ~* \.(ico|jpg|jpeg|png|gif|svg|svgz|webp|avif|avifs|js|css|eot|ttf|otf|woff|woff2)$ {
        add_header Cache-Control "public";
        add_header X-Frame-Options "SAMEORIGIN";
        expires +1y;
        try_files $uri $uri/ /get.php$is_args$args;
    }
    try_files $uri $uri/ /get.php$is_args$args;
    add_header X-Frame-Options "SAMEORIGIN";
}
location /media/customer/      { deny all; }
location /media/downloadable/  { deny all; }
location /media/import/        { deny all; }
location /media/custom_options/{ deny all; }

location /errors/ {
    location ~* \.xml$ { deny all; }
}

# ---- PHP entry points (admin, static.php, get.php, error handlers) ----
location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
    try_files $uri =404;
    fastcgi_pass   $fastcgi_backend;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_param  PHP_FLAG  "session.auto_start=off \n suhosin.session.cryptua=off";
    fastcgi_param  PHP_VALUE "memory_limit=768M \n max_execution_time=18000";
    fastcgi_read_timeout 600s;
    fastcgi_connect_timeout 600s;
    fastcgi_index  index.php;
    fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    include        fastcgi_params;
}
