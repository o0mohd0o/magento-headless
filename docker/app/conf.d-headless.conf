# =============================================================================
# Internal-only Magento listener (http-context; loaded from conf.d).
#
# This listener is NOT published to the host (compose maps only 80/443 of the
# app container). The Next.js storefront fetches GraphQL here, privately, over
# the Docker network:
#
#     MAGENTO_GRAPHQL_URL=http://app:8181/graphql
#
# It forces HTTP_HOST + HTTPS so Magento matches its secure base URL
# (https://magento.test/) and never answers the storefront's internal request
# with a redirect_to_base 301. This is the Docker equivalent of the loopback
# listener used on the native production deploy.
# =============================================================================
server {
    listen 8181;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    root $MAGE_ROOT/pub;
    index index.php;
    autoindex off;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/(index|get|static|errors/report|errors/404|errors/503|health_check)\.php$ {
        try_files $uri =404;
        fastcgi_pass   $fastcgi_backend;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600s;
        fastcgi_connect_timeout 600s;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        # Make Magento believe the request arrived on the public HTTPS host.
        fastcgi_param  HTTPS on;
        fastcgi_param  HTTP_HOST magento.test;
        fastcgi_param  SERVER_NAME magento.test;
        fastcgi_param  SERVER_PORT 443;
        fastcgi_param  PHP_FLAG  "session.auto_start=off \n suhosin.session.cryptua=off";
        fastcgi_param  PHP_VALUE "memory_limit=768M \n max_execution_time=18000";
    }
}
